<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena Shooter 3D — Babylon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Arena Shooter 3D</h1>
      <p class="tagline">Babylon.js · онлайн-арена · пули</p>
    </header>

    <main class="layout">
      <section class="arena-wrap arena-wrap--game">
        <div id="arena3d" class="arena-3d"></div>
        <div id="crosshair" class="crosshair hidden" aria-hidden="true"><span></span><span></span></div>
        <div id="hud" class="hud hidden">
          <div class="hp-bar"><div id="hpFill" class="hp-fill"></div></div>
          <p id="hudText">HP 100</p>
        </div>
        <p id="overlay" class="overlay hidden">Кликните, чтобы играть</p>
        <p id="boardMeta" class="meta">—</p>

        <div id="loginScreen" class="modal-screen">
          <div class="modal-card">
            <h2>Вход в арену</h2>
            <label class="field-label" for="nickInput">Ваш ник</label>
            <input id="nickInput" class="text-input" type="text" maxlength="16" placeholder="Например: Снайпер" />
            <p class="field-label">Команда</p>
            <div class="team-pick">
              <button type="button" id="teamBlue" class="team-btn team-btn--blue team-btn--active">Синие</button>
              <button type="button" id="teamRed" class="team-btn team-btn--red">Красные</button>
            </div>
            <button type="button" id="joinBtn" class="btn btn-primary">В бой</button>
            <p id="loginError" class="login-error"></p>
          </div>
        </div>

        <div id="deathScreen" class="modal-screen hidden">
          <div class="modal-card modal-card--death">
            <h2>Вы погибли</h2>
            <p id="deathMsg" class="death-msg">—</p>
            <button type="button" id="respawnBtn" class="btn btn-primary">Возродиться</button>
          </div>
        </div>
      </section>

      <aside class="sidebar">
        <div class="card">
          <h2>Боец</h2>
          <p id="playerInfo">Подключение…</p>
        </div>
        <div class="card">
          <h2>Управление</h2>
          <p class="hint"><kbd>W</kbd> — вперёд, <kbd>S</kbd> — назад, <kbd>A</kbd><kbd>D</kbd> — в стороны</p>
          <p class="hint"><kbd>ЛКМ</kbd> или <kbd>Пробел</kbd> — выстрел</p>
          <p class="hint">Жёлтые сферы — летящие пули</p>
          <p class="hint"><kbd>Esc</kbd> — отпустить мышь</p>
        </div>
      </aside>
    </main>
  </div>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="app.js?v=21"></script>
</body>
</html>
