<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena Shooter 3D — Babylon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Arena Shooter 3D</h1>
      <p class="tagline">Babylon.js · онлайн-арена · пули</p>
    </header>

    <main class="layout">
      <section class="arena-wrap arena-wrap--game">
        <div id="arena3d" class="arena-3d"></div>
        <div id="crosshair" class="crosshair hidden" aria-hidden="true"><span></span><span></span></div>
        <div id="hud" class="hud hidden">
          <div class="hp-bar"><div id="hpFill" class="hp-fill"></div></div>
          <p id="hudText">HP 100</p>
        </div>
        <p id="overlay" class="overlay">Кликните, чтобы играть</p>
        <p id="boardMeta" class="meta">—</p>
      </section>

      <aside class="sidebar">
        <div class="card">
          <h2>Боец</h2>
          <p id="playerInfo">Подключение…</p>
        </div>
        <div class="card">
          <h2>Управление</h2>
          <p class="hint"><kbd>W</kbd> — вперёд, <kbd>S</kbd> — назад, <kbd>A</kbd><kbd>D</kbd> — в стороны</p>
          <p class="hint"><kbd>ЛКМ</kbd> или <kbd>Пробел</kbd> — выстрел</p>
          <p class="hint">Жёлтые сферы — летящие пули</p>
          <p class="hint"><kbd>Esc</kbd> — отпустить мышь</p>
        </div>
      </aside>
    </main>
  </div>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="app.js?v=20"></script>
</body>
</html>
